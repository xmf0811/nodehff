<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简约艺术画廊</title>
    <style>
        /* 简化版样式 - 纯CSS，无JavaScript */
        body {
            background: #0a0a16;
            color: #e0e0ff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .artwork {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .artwork h3 {
            color: #6a11cb;
            margin: 15px 0 10px;
        }
        
        h1 {
            text-align: center;
            color: #6a11cb;
            font-size: 2.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>简约艺术画廊</h1>
        <div class="gallery">
            <div class="artwork">
                <h3>山水意境</h3>
                <p>传统与现代的融合</p>
            </div>
            <div class="artwork">
                <h3>数字幻想</h3>
                <p>科技与艺术的对话</p>
            </div>
            <div class="artwork">
                <h3>色彩韵律</h3>
                <p>视觉的节奏感</p>
            </div>
        </div>
    </div>
</body>
</html>
